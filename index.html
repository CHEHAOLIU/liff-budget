</head>


<body>


<div class="container app-container">


  <h4 class="mb-3">
    💰 預算設定
  </h4>


  <!-- 分類輸入區 -->
  <div 
    id="form" 
    class="border rounded">
  </div>


  <!-- 總預算 -->
  <div class="total-box d-flex justify-content-between">

    <strong>
      總預算
    </strong>


    <strong id="total">
      0
    </strong>

  </div>


  <!-- 儲存 -->
  <button 
    class="btn btn-primary w-100 mt-3"
    onclick="submitBudget()">

    儲存預算

  </button>


  <!-- 狀態 -->
  <div 
    id="status"
    class="mt-2 text-center text-success">

  </div>


</div>


</body>
